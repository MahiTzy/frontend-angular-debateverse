<div class="bg-gray-100 min-h-screen flex justify-center items-center pb-40">
  <div class="w-full max-w-4xl bg-white rounded-lg shadow-md overflow-hidden">
    <!-- Header Section -->
    <div class="flex justify-between items-center bg-cyan-100 p-4">
      <div class="flex items-center gap-4">
        <!-- Likes Section -->
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="blue">
            <path
              d="M720-120H280v-520l280-280 50 50q7 7 11.5 19t4.5 23v14l-44 174h258q32 0 56 24t24 56v80q0 7-2 15t-4 15L794-168q-9 20-30 34t-44 14Zm-360-80h360l120-280v-80H480l54-220-174 174v406Zm0-406v406-406Zm-80-34v80H160v360h120v80H80v-520h200Z" />
          </svg>
          <span class="text-blue-700">{{debate.totalLikes}} Likes</span>
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="red">
            <path
              d="M240-840h440v520L400-40l-50-50q-7-7-11.5-19t-4.5-23v-14l44-174H120q-32 0-56-24t-24-56v-80q0-7 2-15t4-15l120-282q9-20 30-34t44-14Zm360 80H240L120-480v80h360l-54 220 174-174v-406Zm0 406v-406 406Zm80 34v-80h120v-360H680v-80h200v520H680Z" />
          </svg>
          <span class="text-red-700">{{debate.totalDislikes}} Dislikes</span>
        </div>
        <!-- Total Votes -->
        <div class="flex items-center gap-2 text-blue-500">
          <span><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="#8B1A10">
              <path
                d="M480-560h200v-80H480v80Zm0 240h200v-80H480v80ZM360-520q33 0 56.5-23.5T440-600q0-33-23.5-56.5T360-680q-33 0-56.5 23.5T280-600q0 33 23.5 56.5T360-520Zm0 240q33 0 56.5-23.5T440-360q0-33-23.5-56.5T360-440q-33 0-56.5 23.5T280-360q0 33 23.5 56.5T360-280ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z" />
            </svg></span>
          <span>{{totalVotes}} Votes</span>
        </div>
        <!-- if debate is closed -->
        <div *ngIf="debate.blocked" class="px-2 py-1 bg-red-500 text-white rounded">
          Closed Debate
        </div>


      </div>
      <!-- Go Back Button -->
      <a href="#" routerLink="/debates" class="px-4 py-2 bg-orange-400 text-white rounded hover:bg-orange-500">
        Go Back
      </a>
    </div>

    <!-- Content Section -->
    <div class="p-6">
      <div class="space-y-6">
        <!-- Question Section -->
        <div class="flex justify-between items-start">
          <div>
            <h2 class="text-lg font-semibold mb-1">Question :</h2>
            <p class="text-gray-600">
              {{debate.text}}
            </p>
          </div>
          <!-- Like/Dislike Buttons -->
          <div class="flex gap-2">
            <!-- Like Button -->
            <div class="relative">
              <button (click)="handleLikeDislike(true)" [ngClass]="{
                'p-2 rounded-full border-2': true,
                'border-blue-500': !hasLiked,
                'border-blue-700': hasLiked,
                'bg-blue-100': !hasLiked,
                'hover:bg-blue-300': !hasLiked,
                'text-blue-500': !hasLiked,
                'bg-blue-600': hasLiked,
                'text-white': hasLiked
                    }"> <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                  [attr.fill]="hasLiked ? '#ffffff' : 'blue'">
                  <path
                    d="M720-120H280v-520l280-280 50 50q7 7 11.5 19t4.5 23v14l-44 174h258q32 0 56 24t24 56v80q0 7-2 15t-4 15L794-168q-9 20-30 34t-44 14Zm-360-80h360l120-280v-80H480l54-220-174 174v406Zm0-406v406-406Zm-80-34v80H160v360h120v80H80v-520h200Z" />
                </svg>
              </button>
              <span *ngIf="hasLiked"
                class="absolute left-1/2 transform -translate-x-1/2 mt-11 text-xs text-blue-600 font-semibold">
                Liked
              </span>
            </div>

            <div class="relative">
              <button (click)="handleLikeDislike(false)" [ngClass]="{
                'p-2 rounded-full border-2': true,
                'border-red-500': !hasDisliked,
                'border-red-700': hasDisliked,
                'bg-red-100': !hasDisliked,
                'hover:bg-red-300': !hasDisliked,
                'text-red-500': !hasDisliked,
                'bg-red-600': hasDisliked,
                'text-white': hasDisliked
              }">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                      [attr.fill]="hasDisliked ? '#ffffff' : '#BB271A'">
                      <path
                        d="M240-840h440v520L400-40l-50-50q-7-7-11.5-19t-4.5-23v-14l44-174H120q-32 0-56-24t-24-56v-80q0-7 2-15t4-15l120-282q9-20 30-34t44-14Zm360 80H240L120-480v80h360l-54 220 174-174v-406Zm0 406v-406 406Zm80 34v-80h120v-360H680v-80h200v520H680Z" />
                    </svg>
                  </button>
                  <span *ngIf="hasDisliked"
                  class="absolute left-1/2 transform -translate-x-1/2 mt-11 text-xs text-red-600 font-semibold">
                  Disliked
                </span>
            </div>
          </div>
        </div>

        <!-- Options Section -->
        <div class="space-y-4">
          <ng-container *ngFor="let option of debate.options; let i = index">
            <div *ngIf="!option.blocked" class="flex items-center gap-4">
              <span class="text-blue-500">👥:</span>
              <div class="flex-1 relative">
                <!-- Progress Bar -->
                <div class="flex items-center gap-4">
                  <div class="relative flex-grow px-4 py-2 bg-orange-100 rounded h-10 flex items-center">
                    <div class="absolute inset-0 bg-orange-200 rounded-l"
                      [style.width.%]="debate.totalVotes > 0 ? (option.totalVotes * 100) / debate.totalVotes : 0">
                    </div>

                    <span class="relative z-10 text-black font-medium">
                      {{ option.text }}
                    </span>
                  </div>
                  <!-- Increment/Decrement Buttons -->
                  <div class="flex gap-2 items-center">
                    <button class="px-3 py-1 bg-blue-100 hover:bg-blue-200 rounded" (click)="handleVote(option.id, false)">-</button>
                    <input class="w-10 text-center border border-gray-300 rounded" type="text" name="totalVotes" id="totalVotes"
                      [(ngModel)]="option.userVotes" />
                    <button class="px-3 py-1 bg-blue-100 hover:bg-blue-200 rounded" (click)="handleVote(option.id, true)">+</button>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>




          <!-- Submit Vote Button -->
          <div class="flex justify-center mt-8">
            <button (click)="submitVotes()"
              class="px-6 py-3 bg-orange-400 hover:bg-orange-500 text-xl font-semibold text-white rounded-lg shadow-md hover:shadow-lg">
              Submit Vote
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
